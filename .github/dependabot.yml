# Daily checks on third-party dependencies, each waiting out a 7-day cooldown
# so a release has time to be withdrawn before it reaches a site.
version: 2
updates:
  # The @museumwnf platform packages (viewer-core, viewer-layout, viewer-i18n
  # and the data package) are IGNORED here, and that is no longer because
  # Dependabot cannot reach them — they publish publicly to npmjs now, which
  # Dependabot reads without a token like any other public dependency.
  #
  # They stay ignored because these four are updated deliberately, in
  # lockstep, through the release-then-propagate procedure in
  # museumwithnofrontiers/viewer-workflows (`tools/propagate.mjs`): a release there opens
  # one PR per consumer site right after each release, carrying the new
  # version and whatever adoption changes it needs. A Dependabot bump would
  # race that procedure with an uncoordinated, unreviewed version jump on
  # this site alone. Third-party dependencies and GitHub Actions are
  # unaffected and still flow through Dependabot normally.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@museumwnf/*"

  # The reusable workflows in museumwithnofrontiers/viewer-workflows are pinned to an exact
  # version in .github/workflows/*.yml, never to a moving major tag. Dependabot
  # covers reusable-workflow refs as well as step-level actions, so a new
  # viewer-workflows release arrives here as a pull request that runs this
  # site's own CI before it is adopted — instead of a force-moved `v1`
  # deploying untested CI to every repo at once. Green minor/patch bumps
  # auto-merge via automerge.yml; majors wait for a human.
  #
  # This ecosystem is unaffected by the problem above: it resolves against the
  # GitHub API, not against npm.pkg.github.com.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
